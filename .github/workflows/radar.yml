name: radar

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Mark everything seen without per-job pushes
        type: boolean
        default: false

permissions:
  contents: write
  issues: read

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Load previous state from the data branch
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:state.json > out/state.json
          fi

      - name: Poll
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m radar run --state out/state.json --feed out/feed.json ${{ inputs.bootstrap && '--bootstrap' || '' }}

      - name: Publish feed to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b data
          git add state.json feed.json
          git -c user.name=job-radar -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "feed $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
