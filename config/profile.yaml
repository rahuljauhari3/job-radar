# What counts as a relevant posting. Derived from Rahul's experience bank
# (ML inference/performance at AMD, C++/Python/Java, vLLM, PyTorch/TensorFlow,
# CI/benchmark infra, RAG/agents, DASH Lab cluster ops).
#
# Phrase syntax: case-insensitive, matched on word boundaries.
# A trailing "*" makes it a prefix match ("data scien*" matches "data science").

# Titles from ATS boards and levels.fyi must contain one of these.
# Simplify listings are all internships already, so this gate is skipped there.
intern_markers:
  - intern
  - interns
  - internship
  - co-op
  - coop
  - co op
  - student researcher
  - student engineer
  - summer student
  - summer analyst
  - university program

# Postings are kept when any term mentions one of these years, or has no term.
accepted_years: [2027, 2028]
# Postings whose only terms or title year are these are dropped.
rejected_years: [2025, 2026]
# Postings with no term are kept if posted within this many days.
undated_max_age_days: 45

