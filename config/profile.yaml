# Score bonuses and penalties. Final score is clamped to 0..100.
tier_base: {A: 70, B: 50, C: 30}
bonus:
  target_term: 5          # Summer or Fall 2027 term
  coop: 5                 # co-op in title or term
  masters_listed: 3       # Master's is in the degree list
  ai_ml_category: 3       # Simplify category is AI/ML/Data
penalty:
  citizenship: 40         # U.S. citizenship or clearance required
  no_sponsorship: 3
  bachelors_only: 5
target_terms: [summer 2027, fall 2027]

# Tiers that get one push per posting. Others are batched per run.
push_individually: [A, B]
