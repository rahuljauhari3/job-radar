name: JobRadar
options:
  bundleIdPrefix: com.rahuljauhari
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  JobRadar:
    type: application
    platform: iOS
    sources: [JobRadar]
    info:
      path: JobRadar/Info.plist
      properties:
        CFBundleDisplayName: Job Radar
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.rahuljauhari.JobRadar.refresh]
        LSApplicationQueriesSchemes: [ntfy]
        CFBundleURLTypes:
          - CFBundleURLName: com.rahuljauhari.JobRadar
            CFBundleURLSchemes: [jobradar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rahuljauhari.JobRadar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  JobRadarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [JobRadarTests]
    dependencies:
      - target: JobRadar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rahuljauhari.JobRadarTests
        GENERATE_INFOPLIST_FILE: YES
  JobRadarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [JobRadarUITests]
    dependencies:
      - target: JobRadar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rahuljauhari.JobRadarUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: JobRadar
schemes:
  JobRadar:
    build:
      targets:
        JobRadar: all
        JobRadarTests: [test]
        JobRadarUITests: [test]
    test:
      targets: [JobRadarTests, JobRadarUITests]
