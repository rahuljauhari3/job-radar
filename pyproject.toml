[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "job-radar"
version = "0.1.0"
description = "Polls internship and co-op boards and pushes relevant new postings to your phone."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[tool.setuptools]
packages = ["radar", "radar.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
